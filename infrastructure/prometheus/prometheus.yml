global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'creditrisk-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer-service:8081', 'application-service:8082', 'risk-service:8083',
                  'decision-service:8084', 'audit-service:8085']
        labels:
          application: 'creditrisk'

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: 'api-gateway'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
