# Cloud Run frontend nginx config template.
# nginx official image substitutes ${VAR} from env vars; Cloud Run injects
# PORT (listening port) and we bake GATEWAY_UPSTREAM at build time.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing for React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API and actuator traffic to the api-gateway Cloud Run service
    location /api/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
