name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creditrisk
          POSTGRES_PASSWORD: creditrisk_secret
          POSTGRES_DB: creditrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM
        run: mvn install -N

      - name: Build with Maven
        run: mvn clean compile -DskipTests

      - name: Run Unit Tests
        run: mvn test -pl services/common -am || true

      - name: Build JARs
        run: mvn package -DskipTests

      - name: Build Docker Images
        run: |
          docker build -t creditrisk/api-gateway:latest -f services/api-gateway/Dockerfile .
          docker build -t creditrisk/customer-service:latest -f services/customer-service/Dockerfile .
          docker build -t creditrisk/application-service:latest -f services/application-service/Dockerfile .
          docker build -t creditrisk/risk-service:latest -f services/risk-service/Dockerfile .
          docker build -t creditrisk/decision-service:latest -f services/decision-service/Dockerfile .
          docker build -t creditrisk/audit-service:latest -f services/audit-service/Dockerfile .

  ml-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ml-service
          pip install -r requirements.txt
          pip install pytest

      - name: Run ML Training
        run: |
          cd ml-service
          python training/train_model.py

      - name: Run ML Tests
        run: |
          cd ml-service
          python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
