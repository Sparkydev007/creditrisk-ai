server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/creditrisk}
    username: ${DATABASE_USERNAME:creditrisk}
    password: ${DATABASE_PASSWORD:creditrisk_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:default-secret-key-that-is-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.creditrisk: INFO
    org.springframework.security: WARN
