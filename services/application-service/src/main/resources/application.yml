server:
  port: 8082

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:postgresql://localhost:5432/creditrisk_app
    username: ${DATABASE_USERNAME:creditrisk}
    password: ${DATABASE_PASSWORD:creditrisk_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      application-events: ${KAFKA_TOPIC_APPLICATION_EVENTS:application-events}
      risk-events: ${KAFKA_TOPIC_RISK_EVENTS:risk-events}
      decision-events: ${KAFKA_TOPIC_DECISION_EVENTS:decision-events}
      audit-events: ${KAFKA_TOPIC_AUDIT_EVENTS:audit-events}

jwt:
  secret: ${JWT_SECRET:default-secret-key-that-is-at-least-32-bytes}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.creditrisk: INFO
