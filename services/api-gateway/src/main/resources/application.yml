server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/customers/**,/api/auth/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: customer-service
                fallbackUri: forward:/fallback/customer-service

        - id: application-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/applications/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: application-service
                fallbackUri: forward:/fallback/application-service

        - id: risk-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/risk/**
          filters:
            - StripPrefix=0

        - id: decision-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/decisions/**
          filters:
            - StripPrefix=0

        - id: audit-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
