server:
  port: 8084

spring:
  application:
    name: decision-service
  datasource:
    url: jdbc:postgresql://localhost:5432/creditrisk_decision
    username: ${DATABASE_USERNAME:creditrisk}
    password: ${DATABASE_PASSWORD:creditrisk_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      risk-events: ${KAFKA_TOPIC_RISK_EVENTS:risk-events}
      decision-events: ${KAFKA_TOPIC_DECISION_EVENTS:decision-events}
    consumer:
      group-id: decision-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.creditrisk: INFO
